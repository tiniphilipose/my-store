<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Store | Fashion and accessories</title>
  <meta name="description" content="Handbags, jewellery, wallets, kids items and gifts. Order on WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#top" id="brandName">Your Store</a>
    <label class="search">
      <span class="visually-hidden">Search products</span>
      <input id="searchInput" type="search" placeholder="Search bags, jewellery, gifts" autocomplete="off">
    </label>
    <button class="cart-btn" id="openCart" type="button" aria-label="Open cart">
      Cart <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <main id="top">

    <section class="hero" aria-label="Featured collections">
      <div class="slides" id="slides"></div>
      <div class="dots" id="dots" role="tablist" aria-label="Choose slide"></div>
    </section>

    <!-- Store profile section directly under the hero slider -->
    <section class="store-profile" aria-label="Store information">
      <div class="profile-inner">
        <div class="store-logo-wrap">
          <img id="storeLogo" class="store-logo" src="" alt="Store logo" hidden>
          <div id="storeLogoFallback" class="store-logo-fallback" aria-hidden="true">YS</div>
        </div>
        <div class="profile-details">
          <h2 id="profileStoreName">Your Store</h2>
          <p id="profileTagline">Where style begins</p>
          <div class="profile-actions" aria-label="Contact and review links">
            <a class="profile-icon-link" id="profilePhone" href="#" aria-label="Call the store" title="Call">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.32.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.26.2 2.46.57 3.58a1 1 0 0 1-.25 1.02z"/></svg>
            </a>
            <a class="profile-icon-link" id="profileWhatsApp" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" title="WhatsApp">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.9 11.9 0 0 0 12 .1C5.4.1.1 5.4.1 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6a11.9 11.9 0 0 0 5.8 1.5h.1c6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.5-8.5zM12 21.9a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.9zm5.4-7.3c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2s-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6s-.7-1.7-.9-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.8s1.2 3.2 1.4 3.4c.2.2 2.4 3.7 5.8 5.1.8.3 1.4.5 1.9.6.8.2 1.5.2 2 .1.6-.1 1.8-.7 2.1-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.4z"/></svg>
            </a>
            <a class="profile-icon-link" id="profileMap" href="#" target="_blank" rel="noopener" aria-label="Store location" title="Location">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
            </a>
            <a class="google-review-link" id="profileGoogleReview" href="#" target="_blank" rel="noopener">
              <span class="google-g" aria-hidden="true">G</span>
              <span>Google review</span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <nav class="cats" aria-label="Product categories">
      <div class="cats-inner" id="cats"></div>
    </nav>

    <section class="shop" id="shop">
      <div class="shop-head">
        <h2 id="shopTitle">All products</h2>
        <label class="sort">
          <span class="visually-hidden">Sort products</span>
          <select id="sortSelect">
            <option value="featured">Featured</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="discount">Biggest discount</option>
          </select>
        </label>
      </div>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
    </section>

    <section class="about" id="about">
      <div class="about-copy">
        <h2>About us</h2>
        <p id="aboutText">We bring you handpicked bags, jewellery and everyday accessories at honest prices. Message us on WhatsApp to order, and we will confirm availability and delivery.</p>
      </div>
      <div class="contact" id="contact"></div>
    </section>

  </main>

  <footer class="footer">
    <p id="footerText"></p>
  </footer>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>

  <!-- Product details -->
  <dialog id="productDialog" class="modal" aria-labelledby="pdName">
    <button class="close" type="button" data-close aria-label="Close">&times;</button>
    <div class="modal-body" id="productBody"></div>
  </dialog>

  <!-- Cart drawer -->
  <dialog id="cartDialog" class="drawer" aria-labelledby="cartTitle">
    <div class="drawer-head">
      <h2 id="cartTitle">Your cart</h2>
      <button class="close" type="button" data-close aria-label="Close cart">&times;</button>
    </div>
    <div class="drawer-list" id="cartList"></div>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><strong id="cartTotal">0</strong></div>
      <button class="btn btn-wa" id="checkoutBtn" type="button">Order on WhatsApp</button>
      <button class="link-btn" id="clearCart" type="button">Empty cart</button>
    </div>
  </dialog>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
